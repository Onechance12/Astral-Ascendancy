services:
  - type: web
    name: astral-ascendancy
    runtime: node
    plan: starter
    buildCommand: npm install && npm run db:deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: astral-ascendancy-db
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://astral-ascendancy.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true

databases:
  - name: astral-ascendancy-db
    plan: basic-256mb
    databaseName: astral_ascendancy
    user: astral
